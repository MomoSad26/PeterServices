name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "claude/admiring-babbage-xr5y97" ]
    paths-ignore: [ "**.md" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Copiar la web dentro de la APK
        run: ./sync-web.sh

      - name: Build APK
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Remesas.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Remesas-apk
          path: android/Remesas.apk

      # Solo desde main: publica la APK con un enlace fijo
      # (releases/latest/download/Remesas.apk) para instalarla en el teléfono.
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.$((100 + ${{ github.run_number }}))"
          gh release create "$VERSION" Remesas.apk \
            --target "${{ github.sha }}" \
            --title "Remesas $VERSION" \
            --notes "APK generada automáticamente desde ${{ github.sha }}. Instálala encima de la anterior; los datos se conservan." \
            --latest
